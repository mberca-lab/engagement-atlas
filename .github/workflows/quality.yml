name: Reproduce and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: ruff check atlas tests scripts
      - run: ruff format --check atlas tests scripts
      - run: pytest
      - run: python -m atlas.build --offline
      - run: python scripts/check_site.py
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_browser.py
